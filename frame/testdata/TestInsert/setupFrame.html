<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; }
h1 { font-family: sans-serif; }
</style>
</head>
<body><h1 data-source="frame/insert_test.go" data-fn="setupFrame">TestInsert/setupFrame</h1>
<svg viewBox="-20 -30 870 530"
     width="870" height="530"
     xmlns="http://www.w3.org/2000/svg">

<style>
	.small { font: 8px sans-serif; }
</style>

<g transform="translate(0, 0)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">target rect (20,10)-(400,500)</text>
	</g>
	<g id="draw0">
	<rect x="20" y="10" width="380" height="490" fill="none" stroke="black"/>
	</g>
</g>

</svg>
<script>
(function () {
	var svg = document.querySelector('svg');
	var w = parseInt(svg.getAttribute('width'), 10);
	var h = parseInt(svg.getAttribute('height'), 10);
	function fitZoom() {
		return Math.min(window.innerWidth / w, window.innerHeight / h);
	}
	var zoom = fitZoom();
	svg.style.zoom = zoom;

	document.addEventListener('keydown', function (e) {
		if (!e.metaKey && !e.ctrlKey) { return; }
		if (e.key === '=' || e.key === '+') {
			zoom *= 1.2;
		} else if (e.key === '-') {
			zoom /= 1.2;
		} else if (e.key === '0') {
			zoom = fitZoom();
		} else {
			return;
		}
		e.preventDefault();
		svg.style.zoom = zoom;
	});
}());
</script>
<script>
(function () {
	var h1 = document.querySelector('h1[data-source]');
	if (!h1) { return; }
	var src = h1.getAttribute('data-source');
	var fn = h1.getAttribute('data-fn');
	var filePath = window.location.pathname;
	var sourceDir = src.split('/')[0];
	var m = filePath.match(new RegExp('^(.*?)/' + sourceDir + '/testdata/'));
	if (!m) { return; }
	var a = document.createElement('a');
	a.href = 'plumb:' + m[1] + '/' + src + ':/' + fn;
	a.textContent = h1.textContent;
	h1.textContent = '';
	h1.appendChild(a);
}());
</script>
</body>
</html>
