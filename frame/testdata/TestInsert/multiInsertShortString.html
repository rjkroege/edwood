<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; }
h1 { font-family: sans-serif; }
</style>
</head>
<body><h1 data-source="frame/insert_test.go" data-fn="multiInsertShortString">TestInsert/multiInsertShortString</h1>
<svg viewBox="-20 -30 870 650"
     width="870" height="650"
     xmlns="http://www.w3.org/2000/svg">

<style>
	.small { font: 8px sans-serif; }
</style>

<g transform="translate(0, 0)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">target rect (20,10)-(400,100)</text>
	</g>
	<g id="draw0">
	<rect x="20" y="10" width="380" height="90" fill="none" stroke="black"/>
	</g>
</g>

<g transform="translate(0, 130)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,10)-(400,20) [0,0],[-,1]</text>
	</g>
	<defs>
<g id="draw1">
	<use href="#draw0" />
	<rect x="20" y="10" width="380" height="10" fill="#fefee9"/>
</g>
</defs>
<use href="#draw1" />
<rect x="20" y="10" width="380" height="10" fill="none" stroke="navy" stroke-width="1"/>
</g>

<g transform="translate(0, 260)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,20)-(46,30) [0,1],[2,1]</text>
	</g>
	<defs>
<g id="draw2">
	<use href="#draw1" />
	<rect x="20" y="20" width="26" height="10" fill="#fefee9"/>
</g>
</defs>
<use href="#draw2" />
<rect x="20" y="20" width="26" height="10" fill="none" stroke="navy" stroke-width="1"/>
</g>

<g transform="translate(0, 390)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;ab&#34; atpoint: (20,10) [0,0] fill: black</text>
	</g>
	<g id="draw3">
	<use href="#draw2" />
	<text x="22" y="18" fill="black" class="small">a</text>
	<text x="35" y="18" fill="black" class="small">b</text>
	</g>
</g>

<g transform="translate(0, 520)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;cd&#34; atpoint: (20,20) [0,1] fill: black</text>
	</g>
	<g id="draw4">
	<use href="#draw3" />
	<text x="22" y="28" fill="black" class="small">c</text>
	<text x="35" y="28" fill="black" class="small">d</text>
	</g>
</g>

</svg>
<script>
(function () {
	var svg = document.querySelector('svg');
	var w = parseInt(svg.getAttribute('width'), 10);
	var h = parseInt(svg.getAttribute('height'), 10);
	function fitZoom() {
		return Math.min(window.innerWidth / w, window.innerHeight / h);
	}
	var zoom = fitZoom();
	svg.style.zoom = zoom;

	document.addEventListener('keydown', function (e) {
		if (!e.metaKey && !e.ctrlKey) { return; }
		if (e.key === '=' || e.key === '+') {
			zoom *= 1.2;
		} else if (e.key === '-') {
			zoom /= 1.2;
		} else if (e.key === '0') {
			zoom = fitZoom();
		} else {
			return;
		}
		e.preventDefault();
		svg.style.zoom = zoom;
	});
}());
</script>
<script>
(function () {
	var h1 = document.querySelector('h1[data-source]');
	if (!h1) { return; }
	var src = h1.getAttribute('data-source');
	var fn = h1.getAttribute('data-fn');
	var filePath = window.location.pathname;
	var sourceDir = src.split('/')[0];
	var m = filePath.match(new RegExp('^(.*?)/' + sourceDir + '/testdata/'));
	if (!m) { return; }
	var a = document.createElement('a');
	a.href = 'plumb:' + m[1] + '/' + src + ':/' + fn;
	a.textContent = h1.textContent;
	h1.textContent = '';
	h1.appendChild(a);
}());
</script>
</body>
</html>
