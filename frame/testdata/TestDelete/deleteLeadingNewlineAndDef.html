<g id="draw7">

	<rect x="20" y="20" width="40" height="10" fill="#fefee9"/>

<use href="#draw7" />

</svg>
<script>
(function () {
	var svg = document.querySelector('svg');
	var w = parseInt(svg.getAttribute('width'), 10);
	var h = parseInt(svg.getAttribute('height'), 10);
	function fitZoom() {
		return Math.min(window.innerWidth / w, window.innerHeight / h);
	}
	var zoom = fitZoom();
	svg.style.zoom = zoom;

	document.addEventListener('keydown', function (e) {
		if (!e.metaKey && !e.ctrlKey) { return; }
		if (e.key === '=' || e.key === '+') {
			zoom *= 1.2;
		} else if (e.key === '-') {
			zoom /= 1.2;
		} else if (e.key === '0') {
			zoom = fitZoom();
		} else {
			return;
		}
		e.preventDefault();
		svg.style.zoom = zoom;
	});
}());
</script>
</body>
</html>
