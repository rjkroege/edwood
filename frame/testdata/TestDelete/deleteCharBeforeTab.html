<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; }
</style>
</head>
<body>
<svg viewBox="-20 -30 350 490"
     width="350" height="490"
     xmlns="http://www.w3.org/2000/svg">

<style>
	.small { font: 8px sans-serif; }
	.title { font: bold 16px sans-serif; }
</style>
<text x="20" y="-10" fill="black" class="title">TestDelete/deleteCharBeforeTab</text>

<g transform="translate(0, 0)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">target rect (20,10)-(140,40)</text>
	</g>
	<g id="draw0">
	<rect x="20" y="10" width="120" height="30" fill="none" stroke="black"/>
	</g>
</g>

<g transform="translate(0, 70)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,10)-(140,20) [0,0],[-,1]</text>
	</g>
	<defs>
<g id="draw1">
	<use href="#draw0" />
	<rect x="20" y="10" width="120" height="10" fill="#fefee9"/>
</g>
</defs>
<use href="#draw1" />
<rect x="20" y="10" width="120" height="10" fill="none" stroke="navy" stroke-width="1"/>
</g>

<g transform="translate(0, 140)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,20)-(98,30) [0,1],[6,1]</text>
	</g>
	<defs>
<g id="draw2">
	<use href="#draw1" />
	<rect x="20" y="20" width="78" height="10" fill="#fefee9"/>
</g>
</defs>
<use href="#draw2" />
<rect x="20" y="20" width="78" height="10" fill="none" stroke="navy" stroke-width="1"/>
</g>

<g transform="translate(0, 210)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;0a&#34; atpoint: (20,10) [0,0] fill: black</text>
	</g>
	<g id="draw3">
	<use href="#draw2" />
	<text x="22" y="18" fill="black" class="small">0</text>
	<text x="35" y="18" fill="black" class="small">a</text>
	</g>
</g>

<g transform="translate(0, 280)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;b&#34; atpoint: (124,10) [8,0] fill: black</text>
	</g>
	<g id="draw4">
	<use href="#draw3" />
	<text x="126" y="18" fill="black" class="small">b</text>
	</g>
</g>

<g transform="translate(0, 350)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;1cd2ef&#34; atpoint: (20,20) [0,1] fill: black</text>
	</g>
	<g id="draw5">
	<use href="#draw4" />
	<text x="22" y="28" fill="black" class="small">1</text>
	<text x="35" y="28" fill="black" class="small">c</text>
	<text x="48" y="28" fill="black" class="small">d</text>
	<text x="61" y="28" fill="black" class="small">2</text>
	<text x="74" y="28" fill="black" class="small">e</text>
	<text x="87" y="28" fill="black" class="small">f</text>
	</g>
</g>

<g transform="translate(0, 420)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (33,10)-(124,20) [1,0],[7,1]</text>
	</g>
	<defs>
<g id="draw6">
	<use href="#draw5" />
	<rect x="33" y="10" width="91" height="10" fill="#fefee9"/>
</g>
</defs>
<use href="#draw6" />
<rect x="33" y="10" width="91" height="10" fill="none" stroke="navy" stroke-width="1"/>
</g>

</svg>
<script>
(function () {
	var svg = document.querySelector('svg');
	var w = parseInt(svg.getAttribute('width'), 10);
	var h = parseInt(svg.getAttribute('height'), 10);
	function fitZoom() {
		return Math.min(window.innerWidth / w, window.innerHeight / h);
	}
	var zoom = fitZoom();
	svg.style.zoom = zoom;

	document.addEventListener('keydown', function (e) {
		if (!e.metaKey && !e.ctrlKey) { return; }
		if (e.key === '=' || e.key === '+') {
			zoom *= 1.2;
		} else if (e.key === '-') {
			zoom /= 1.2;
		} else if (e.key === '0') {
			zoom = fitZoom();
		} else {
			return;
		}
		e.preventDefault();
		svg.style.zoom = zoom;
	});
}());
</script>
</body>
</html>
