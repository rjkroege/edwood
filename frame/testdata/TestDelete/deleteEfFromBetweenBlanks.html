<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
</head>
<body>
<svg viewBox="-20 -30 190 1300" xmlns="http://www.w3.org/2000/svg">

<style>
	.small { font: 8px sans-serif; }
</style>

<g transform="translate(0, 0)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">target rect (20,10)-(60,70)</text>
	</g>
	<g id="draw0">
	<rect x="20" y="10" width="40" height="60" fill="none" stroke="black"/>
	</g>
</g>

<g transform="translate(0, 100)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,10)-(60,20) [0,0],[-,1]</text>
	</g>
	<g id="draw1">
	<use href="#draw0" />
	<rect x="20" y="10" width="40" height="10" fill="#fefee9"/>
	</g>
</g>

<g transform="translate(0, 200)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,20)-(60,60) [0,1],[-,4]</text>
	</g>
	<g id="draw2">
	<use href="#draw1" />
	<rect x="20" y="20" width="40" height="40" fill="#fefee9"/>
	</g>
</g>

<g transform="translate(0, 300)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,60)-(20,70) [0,5],[0,1]</text>
	</g>
	<g id="draw3">
	<use href="#draw2" />
	<rect x="20" y="60" width="0" height="10" fill="#fefee9"/>
	</g>
</g>

<g transform="translate(0, 400)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;abc&#34; atpoint: (20,10) [0,0] fill: black</text>
	</g>
	<g id="draw4">
	<use href="#draw3" />
	<text x="22" y="18" fill="black" class="small">a</text>
	<text x="35" y="18" fill="black" class="small">b</text>
	<text x="48" y="18" fill="black" class="small">c</text>
	</g>
</g>

<g transform="translate(0, 500)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;def&#34; atpoint: (20,30) [0,2] fill: black</text>
	</g>
	<g id="draw5">
	<use href="#draw4" />
	<text x="22" y="38" fill="black" class="small">d</text>
	<text x="35" y="38" fill="black" class="small">e</text>
	<text x="48" y="38" fill="black" class="small">f</text>
	</g>
</g>

<g transform="translate(0, 600)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">string &#34;ghi&#34; atpoint: (20,50) [0,4] fill: black</text>
	</g>
	<g id="draw6">
	<use href="#draw5" />
	<text x="22" y="58" fill="black" class="small">g</text>
	<text x="35" y="58" fill="black" class="small">h</text>
	<text x="48" y="58" fill="black" class="small">i</text>
	</g>
</g>

<g transform="translate(0, 700)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (33,30)-(60,40) [1,2],[-,1]</text>
	</g>
	<g id="draw7">
	<use href="#draw6" />
	<rect x="33" y="30" width="27" height="10" fill="#fefee9"/>
	</g>
</g>

<g transform="translate(0, 800)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,40)-(60,50) [0,3],[-,1]</text>
	</g>
	<g id="draw8">
	<use href="#draw7" />
	<rect x="20" y="40" width="40" height="10" fill="#fefee9"/>
	</g>
</g>

<g transform="translate(0, 900)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">blit (20,50)-(60,60) [0,4],[-,1], to (20,40)-(60,50) [0,3],[-,1]</text>
	</g>
	<use href="#draw8" />
<rect x="20" y="50" width="40" height="10" fill="none" stroke="red"/>
<g transform="translate(70, 0)">
	<g id="draw9">
		<use href="#draw8" />
		<clipPath id="draw9_blitsource">
			
			<rect x="20" y="50" width="40" height="10" />
		</clipPath>
		<use href="#draw8" clip-path="url(#draw9_blitsource)" x="0" y="-10" />
	</g>
</g>

</g>

<g transform="translate(0, 1000)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">blit (20,60)-(60,70) [0,5],[-,1], to (20,50)-(60,60) [0,4],[-,1]</text>
	</g>
	<use href="#draw9" />
<rect x="20" y="60" width="40" height="10" fill="none" stroke="red"/>
<g transform="translate(70, 0)">
	<g id="draw10">
		<use href="#draw9" />
		<clipPath id="draw10_blitsource">
			
			<rect x="20" y="60" width="40" height="10" />
		</clipPath>
		<use href="#draw9" clip-path="url(#draw10_blitsource)" x="0" y="-10" />
	</g>
</g>

</g>

<g transform="translate(0, 1100)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,50)-(60,60) [0,4],[-,1]</text>
	</g>
	<g id="draw11">
	<use href="#draw10" />
	<rect x="20" y="50" width="40" height="10" fill="#fefee9"/>
	</g>
</g>

<g transform="translate(0, 1200)">
	<g transform="translate(0, -2)">
		<text x="0" y="0" fill="black" class="small">fill (20,60)-(20,70) [0,5],[0,1]</text>
	</g>
	<g id="draw12">
	<use href="#draw11" />
	<rect x="20" y="60" width="0" height="10" fill="#fefee9"/>
	</g>
</g>

</svg>
</body>
</html>
